---
# The reader/producer contract, run against the whole workspace.
#
# t/consumer-contract.t declares what a Geo::Coder::Free result promises and
# which files may read it.  Parts 2 and 3 need the sibling checkouts (the value
# object, and every distribution whose code reads a result): without them they
# skip, and a build that skips them cannot tell a producer that stopped setting
# a promise, or a consumer nobody registered, from a job where nothing was
# checked at all.  So the checkouts are put there deliberately, in the layout
# the test expects, and CONTRACT_STRICT turns a missing one into a failure.
#
# This is the body of the job.  It used to be a whole workflow copied into the
# four distributions that run it - this one, Database-BI, Geo-Location-Point and
# HTML-Genealogy-Map - kept in step by hand, and the copies drifted: one lost
# the producer's checkout and stopped CI at "workspace/Geo-Coder-Free was not
# checked out" before the contract ran, while every test in Geo-Coder-Free still
# passed; another pinned the Perl setup to a different commit.  Each of the four
# now keeps only a caller (.github/workflows/contract.yml) that passes the three
# things which differ between them - its name, and the repository and ref it is
# running at - and everything else is here, in one file, which cannot drift from
# itself.  t/contract-workflows.t fails if a caller stops being a caller.
#
# t/contract-workflows.t and the workspace check below read the same
# DISTRIBUTIONS list, so a distribution cannot be checked for on the way in and
# overlooked when it is checked out.
name: Reader/producer contract (reusable)

on:
  workflow_call:
    inputs:
      distribution:
        description: This distribution; it is checked out at the caller's ref
        required: true
        type: string
      repository:
        description: The caller's repository as owner/name, so the checkout is not left to the called workflow's context
        required: true
        type: string
      ref:
        description: The caller's ref, so a pull request is tested at its merge commit rather than at the default branch
        required: true
        type: string
    secrets:
      WORKSPACE_TOKEN:
        description: Reads the sibling checkouts if one of them is private; the default token is used otherwise
        required: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATED_TESTING: 1
      NO_NETWORK_TESTING: 1
      NONINTERACTIVE_TESTING: 1
      # The workspace below is assembled on purpose, so a checkout that is not
      # there is a broken job rather than an installation without a workspace.
      CONTRACT_STRICT: 1
      # The one list of distributions the job assembles: the checkouts below,
      # the check on the way in, and the check that runs are all read from it.
      # t/contract-workflows.t reads this line too, and fails if a name on it
      # has no checkout below.
      DISTRIBUTIONS: Geo-Coder-Free Test-Consumer-Contract Geo-Location-Point Database-BI HTML-Genealogy-Map HTML-OSM Geo-Coder-List
    steps:
      # The three inputs, never the called workflow's github context: GitHub
      # documents the context as the caller's, but a known runner bug gives a
      # pull request's called workflow the default branch's ref, which would
      # quietly test the default branch instead of the merge commit.  Passing
      # the repository and ref through makes the checkout the caller's own
      # commit, and the check below makes a mismatched input loud, not silent.
      - name: Check out this distribution at the commit under test
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: workspace/${{ inputs.distribution }}

      # The producer.  The declaration and the test that runs it live in
      # Geo::Coder::Free, and workspace/ is the directory both look in for the
      # consumer checkouts, so the workspace root has to hold it too: without
      # this checkout there is no t/ directory to run the contract from.  When
      # this distribution is the one under test the step above has already put
      # it there at the caller's commit, so this checkout is skipped.
      - name: Check out Geo-Coder-Free
        if: inputs.distribution != 'Geo-Coder-Free'
        uses: actions/checkout@v7
        with:
          repository: nigelhorne/Geo-Coder-Free
          path: workspace/Geo-Coder-Free
          # The default token reads public repositories; set WORKSPACE_TOKEN
          # only if one of the siblings is private.
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}

      - name: Check out Test-Consumer-Contract
        if: inputs.distribution != 'Test-Consumer-Contract'
        uses: actions/checkout@v7
        with:
          repository: nigelhorne/Test-Consumer-Contract
          path: workspace/Test-Consumer-Contract
          # The default token reads public repositories; set WORKSPACE_TOKEN
          # only if one of the siblings is private.
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}

      - name: Check out Geo-Location-Point
        if: inputs.distribution != 'Geo-Location-Point'
        uses: actions/checkout@v7
        with:
          repository: nigelhorne/Geo-Location-Point
          path: workspace/Geo-Location-Point
          # The default token reads public repositories; set WORKSPACE_TOKEN
          # only if one of the siblings is private.
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}

      - name: Check out Database-BI
        if: inputs.distribution != 'Database-BI'
        uses: actions/checkout@v7
        with:
          repository: nigelhorne/Database-BI
          path: workspace/Database-BI
          # The default token reads public repositories; set WORKSPACE_TOKEN
          # only if one of the siblings is private.
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}

      - name: Check out HTML-Genealogy-Map
        if: inputs.distribution != 'HTML-Genealogy-Map'
        uses: actions/checkout@v7
        with:
          repository: nigelhorne/HTML-Genealogy-Map
          path: workspace/HTML-Genealogy-Map
          # The default token reads public repositories; set WORKSPACE_TOKEN
          # only if one of the siblings is private.
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}

      # Registered by hand in the declaration: it takes a geocoder object and
      # never names Geo::Coder::Free, so discovery cannot find it, but its reads
      # are checked all the same.
      - name: Check out HTML-OSM
        if: inputs.distribution != 'HTML-OSM'
        uses: actions/checkout@v7
        with:
          repository: nigelhorne/HTML-OSM
          path: workspace/HTML-OSM
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}

      # Recorded as ignored with a reason, but only the checkout makes that
      # reason run: without it a consumer added here is not seen at all.
      - name: Check out Geo-Coder-List
        if: inputs.distribution != 'Geo-Coder-List'
        uses: actions/checkout@v7
        with:
          repository: nigelhorne/Geo-Coder-List
          path: workspace/Geo-Coder-List
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}

      # A checkout that silently failed would otherwise show up as a skip.
      - name: Check that the workspace is there
        shell: bash
        env:
          SELF: ${{ inputs.distribution }}
          SELF_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -eu

          # A caller that named itself wrongly would check out a workspace the
          # list below does not check, so it is refused rather than half-run.
          case " $DISTRIBUTIONS " in
            *" $SELF "*) ;;
            *)
              echo "::error::distribution '$SELF' is not one of: $DISTRIBUTIONS"
              exit 1
              ;;
          esac

          # The commit under test must be the caller's repository, not the one
          # this body lives in; the checkout above passes both through, so a
          # caller that passes the wrong value is caught here.  Both the https
          # and the ssh forms of the remote end in <owner>/<repo>.
          origin=$(git -C "workspace/$SELF" remote get-url origin || true)
          case "$origin" in
            *"/$SELF_REPOSITORY"|*"/$SELF_REPOSITORY.git"|*":$SELF_REPOSITORY"|*":$SELF_REPOSITORY.git") ;;
            *)
              echo "::error::workspace/$SELF came from '$origin', not '$SELF_REPOSITORY'"
              exit 1
              ;;
          esac

          for dist in $DISTRIBUTIONS; do
            if [ ! -d "workspace/$dist" ]; then
              echo "::error::workspace/$dist was not checked out"
              exit 1
            fi
          done
          ls -1 workspace

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7 # v1.44.2
        with:
          perl-version: '5.40'

      - name: Install dependencies
        shell: bash
        run: |-
          set -eu
          cpanm --notest --quiet Test::Most
          # The checker is a checkout, not an installed distribution: the
          # contract puts its lib/ on @INC, so it loads, but nothing installs
          # the modules its cpanfile requires.  Without them the first require
          # stops at Params::Validate::Strict and CONTRACT_STRICT turns that
          # into a bailout rather than a skip - which is how every run of this
          # job failed, from the first one, before it ever reached a test.
          cpanm --notest --quiet --installdeps ./workspace/Test-Consumer-Contract
          # The accessor check loads the value object, so its own dependencies
          # are needed; the rest of the contract only reads source.
          cpanm --notest --quiet --installdeps ./workspace/Geo-Location-Point

      - name: Run the contract
        working-directory: workspace/Geo-Coder-Free
        shell: bash
        run: |-
          set -eu
          # t/contract-workflows.t guards this job rather than the module: it
          # fails if a caller goes back to carrying a copy of the body, or if
          # this body lists a distribution it does not check out, so the four
          # cannot drift apart again unnoticed.
          prove -l -v t/consumer-contract.t t/contract-strict.t t/contract-workflows.t

      - name: Show the diagnostic on failure
        if: failure()
        shell: bash
        run: |-
          for log in ~/.cpanm/work/*/build.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            tail -100 "$log"
          done
