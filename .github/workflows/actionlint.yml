---
# Lint the workflows themselves.
#
# A workflow file is accepted or refused whole, before any job runs, and the
# refusal names a line rather than the mistake.  Database-BI's browser.yml put
# ${{ runner.temp }} in a job-level env, where the contexts available are
# github, needs, strategy, matrix, vars, inputs and secrets; GitHub answered
#
#   Invalid workflow file: .github/workflows/browser.yml#L1
#   (Line: 83, Col: 30): Unrecognized named-value: 'runner'
#
# and ran none of the four jobs that file held.  Nothing in the test suites
# reads .github/ - it could only be found by pushing - so the workflows need a
# check of their own.
#
# This file is carried unchanged by every distribution whose workflows are
# copies of another's - the contract job's four callers, the siblings it checks
# out, and the eight that the location-predicate fuzz assembles - so a workflow
# that one of them gets wrong is caught in that repository too, under the same
# rules.  It is a copy rather than one reusable workflow because the workflows
# it checks include the callers themselves: a caller that cannot be parsed
# could not reach a workflow it calls, which is the failure it exists for.
#
# actionlint reads the expressions for each context (job-level env, step env,
# if:, with:), which is the rule that broke, and the rest of what a workflow
# must get right: an action's inputs, needs: references, matrix shape, cron
# syntax.  With shellcheck on PATH it also checks the shell inside every run:
# block, which is the other half of a workflow - a pipeline that splits a
# filename on whitespace fails only for the one file with a space in it.
#
# Both are downloaded from pinned releases and their checksums verified, rather
# than installed through a marketplace action or apt: the runner image's
# shellcheck is a different version, and a linter that changes with the image
# turns a green run red without a commit.  The workflows are found rather than
# listed, so a workflow added later is covered without being added here as well.
#
# Switching shellcheck on found these in the workflows, and they are fixed
# rather than silenced: unquoted command substitutions of the documented
# `eval "$(perl -Mlocal::lib)"` idiom (SC2046); unquoted variables, among them
# the writes to $GITHUB_ENV and $GITHUB_PATH and the directories held in
# $GITHUB_WORKSPACE (SC2086); `find ... | xargs` pipelines that split on
# whitespace in a filename (SC2038, now -print0 and -0); and a `while read`
# that would mangle a backslash (SC2162, now read -r).  Database-BI's one
# `# shellcheck disable=SC2086` went with them: the command it was silencing is
# an array now, so the flag it disabled is gone.
name: Workflow lint

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The releases, and the sha256 of each Linux artefact.  actionlint's comes
  # from its own checksums file; shellcheck publishes none for 0.10.0, so that
  # one is the tarball as downloaded from the release.  Moving to a newer
  # version means changing both lines, which is the point: a linter that
  # changed under us could turn a green run red without a commit.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: 0.10.0
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify actionlint
        shell: bash
        run: |
          set -eu
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl -sSfL -o "$archive" "$url"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Download and verify shellcheck
        shell: bash
        run: |
          set -eu
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"

          curl -sSfL -o "$archive" "$url"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          # The tarball holds one directory of that name, which is the one the
          # lint step puts on PATH.
          tar -xJf "$archive" -C "$RUNNER_TEMP"

      - name: Lint every workflow
        shell: bash
        run: |
          set -eu

          # actionlint runs shellcheck when it finds one on PATH and skips the
          # rule without saying so when it does not, so the version is printed:
          # the run states that the shell inside the run: blocks was checked.
          export PATH="$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}:$PATH"
          shellcheck --version | sed -n '2p'

          # Named rather than left to the linter's own walk: the run says which
          # files it read, and a repository whose workflows had moved would fail
          # here instead of linting nothing and reporting success.
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no workflow files found under .github/workflows"
            exit 1
          fi

          echo "Linting ${#files[@]} workflow files:"
          printf '  %s\n' "${files[@]}"
          "$RUNNER_TEMP/actionlint" "${files[@]}"
